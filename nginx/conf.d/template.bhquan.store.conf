# ──────────────────────────────────────────
# WEBTEMPLATE — Nginx config cho shared-nginx (Docker)
# Deploy: copy len /opt/infra/nginx/conf.d/template.bhquan.store.conf
#
# Dung resolver + set $var de nginx khong crash khi container chua up.
# Proxy qua ten container tren network webtemplate_frontend.
# ──────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name template.bhquan.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name template.bhquan.store;

    ssl_certificate     /etc/letsencrypt/live/template.bhquan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/template.bhquan.store/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ~ /\. {
        deny all;
        return 404;
    }

    # ─── BFF / API → backend ──
    location /api/ {
        set $wt_backend http://wt-backend:6001;
        proxy_pass $wt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ─── Next.js static assets (immutable) ─
    location /_next/static/ {
        set $wt_frontend http://wt-frontend:6000;
        proxy_pass $wt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ─── App (SSR + rest) ──
    location / {
        set $wt_frontend http://wt-frontend:6000;
        proxy_pass $wt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}